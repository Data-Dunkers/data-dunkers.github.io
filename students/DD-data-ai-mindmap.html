        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --blue: #0072CE;
            --blue-dark: #005A9C;
            --blue-bright: #00A9E0;
            --navy: #002D62;
            --coral: #F4633A;
            --coral-dark: #D94F28;
            --gold: #FFB81C;
            --ink: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0072CE 0%, #005A9C 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .header { width: 100%; max-width: 1400px; text-align: center; margin-bottom: 18px; }

        .center-title {

            color: white;
            font-size: 2.1em;
            padding: 16px 50px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 4px solid white;
            display: inline-block;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .instructions { color: white; margin-top: 10px; font-size: 1em; opacity: 0.95; }

        .top-nav {
            width: 100%;
            max-width: 1400px;
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .main-branch-btn {
            background: linear-gradient(135deg, #00A9E0 0%, #0072CE 100%);
            color: white;
            padding: 13px 22px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            border: 3px solid transparent;
            font-size: 1.05em;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: inherit;
        }
        .main-branch-btn:hover, .main-branch-btn:focus-visible { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
        .main-branch-btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
        .main-branch-btn.active { border-color: white; }
        .main-branch-btn.coral { background: linear-gradient(135deg, #F4763A 0%, #D94F28 100%); }
        .main-branch-btn.gold { background: linear-gradient(135deg, #FFB81C 0%, #E89B00 100%); color: var(--navy); }
        .main-branch-btn .emoji { font-size: 1.4em; }

            width: 100%;
            max-width: 1400px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            padding: 35px;
        }

        .welcome-message { text-align: center; color: #555; font-size: 1.1em; padding: 15px 10px; line-height: 1.7; }

        .interest-block { margin-top: 26px; }
        .interest-block h3 { color: var(--navy); font-size: 1.25em; margin-bottom: 6px; }
        .interest-block p { color: #777; font-size: 0.95em; margin-bottom: 16px; }

        .chip {
            background: #f0f7ff;
            border: 2px solid var(--blue-bright);
            color: var(--blue-dark);
            padding: 10px 18px;
            border-radius: 999px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .chip:hover, .chip:focus-visible { background: var(--blue-bright); color: white; transform: translateY(-2px); }
        .chip:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 18px;
            margin-top: 18px;
        }

        .category-card {
            background: linear-gradient(135deg, #00B5E2 0%, #00A9CE 100%);
            color: white;
            padding: 24px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: none;
            text-align: left;
            font-family: inherit;
            width: 100%;

        .category-card:hover, .category-card:focus-visible { transform: translateY(-5px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
        .category-card:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
        .category-card h3 { font-size: 1.25em; display: flex; align-items: center; gap: 10px; }
        .category-card .emoji { font-size: 1.5em; }

        .detail-view { animation: fadeIn 0.4s ease; }

        .detail-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 22px;
            padding-bottom: 16px;
            border-bottom: 3px solid var(--blue);
            flex-wrap: wrap;
        }
        .detail-header.coral { border-bottom-color: var(--coral); }
        .detail-header h2 { color: var(--blue); font-size: 1.7em; flex: 1; min-width: 200px; }
        .detail-header.coral h2 { color: var(--coral-dark); }
        .detail-header .emoji { font-size: 2.2em; }

        .back-btn {
            background: var(--blue);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            margin-left: auto;
            transition: all 0.2s ease;
            font-family: inherit;

        .back-btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

            background: #f8f9fa;
            padding: 18px;
            border-radius: 10px;
            border-left: 4px solid var(--blue);
            line-height: 1.6;
            font-size: 1.02em;
            color: var(--ink);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .career-card {
            background: #f8f9fa;
            border-radius: 12px;
            border-left: 5px solid var(--blue);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .career-card.coral { border-left-color: var(--coral); }

        .career-toggle {
            width: 100%;
            background: none;
            border: none;
            font-family: inherit;
            text-align: left;
            padding: 16px 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.05em;
            color: var(--ink);

        .career-toggle:hover { background: #eef4fb; }
        .career-toggle:focus-visible { outline: 3px solid var(--gold); outline-offset: -3px; }
        .career-toggle .c-emoji { font-size: 1.5em; }
        .career-toggle .c-name { font-weight: 700; color: var(--navy); }
        .career-toggle .c-tag { color: #666; font-size: 0.92em; }
        .career-toggle .c-arrow { margin-left: auto; color: var(--blue); font-weight: 700; transition: transform 0.2s ease; }
        .career-card.open .c-arrow { transform: rotate(90deg); }

        .career-body { display: none; padding: 0 18px 18px; animation: fadeIn 0.3s ease; }
        .career-card.open .career-body { display: block; }

        .glimpse {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 12px;
            line-height: 1.6;
            font-size: 0.98em;
        }
        .glimpse .g-label { font-weight: 700; color: var(--blue-dark); font-size: 0.85em; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 4px; }

        .ai-split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .ai-box { border-radius: 10px; padding: 12px 14px; font-size: 0.95em; line-height: 1.55; }
        .ai-box .g-label { display: block; font-weight: 700; font-size: 0.82em; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .ai-changes { background: #fff3ec; border: 1px solid #f8c9b4; color: #7a3416; }
        .ai-changes .g-label { color: var(--coral-dark); }
        .ai-human { background: #edf7ee; border: 1px solid #bfe3c2; color: #22532a; }
        .ai-human .g-label { color: #2e7d32; }

        .talk-box {
            background: #fff8e6;
            border: 2px dashed var(--gold);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 12px;
            font-size: 1em;
            line-height: 1.55;
            color: #5c4600;
        }
        .talk-box .g-label { display: block; font-weight: 700; color: #9a7500; font-size: 0.85em; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }

        .watch-link {
            display: inline-block;
            background: var(--blue);
            color: white;
            text-decoration: none;
            padding: 9px 16px;
            border-radius: 8px;
            font-size: 0.95em;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .watch-link:hover, .watch-link:focus-visible { background: var(--blue-dark); transform: translateY(-2px); }
        .watch-link:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

        .section-title { color: var(--blue); font-size: 1.7em; margin-bottom: 6px; text-align: center; }
        .section-title.coral { color: var(--coral-dark); }
        .section-sub { text-align: center; color: #777; margin-bottom: 10px; font-size: 1em; }

        .cat-talk {
            background: #fff8e6;
            border: 2px dashed var(--gold);
            border-radius: 10px;
            padding: 14px 16px;
            margin-top: 18px;
            color: #5c4600;
            line-height: 1.55;
        }
        .cat-talk .g-label { display: block; font-weight: 700; color: #9a7500; font-size: 0.85em; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }

        @media (max-width: 850px) {
            .center-title { font-size: 1.5em; padding: 14px 26px; }
            .top-nav { gap: 10px; }
            .main-branch-btn { flex: 1 1 45%; justify-content: center; padding: 12px 10px; font-size: 0.95em; }
            .category-grid { grid-template-columns: 1fr; }
            .ai-split { grid-template-columns: 1fr; }
            .center-display { padding: 22px; }
        }
    </style>
</head>

// ---------- FLAT INDEX (for Surprise Me + interest matching) ----------
const ALL_CAREERS = [];
["dataCareers", "everyday"].forEach(branch => {
  Object.entries(content[branch].categories).forEach(([catKey, cat]) => {
    cat.careers.forEach((c, idx) => {
      ALL_CAREERS.push({ branch, catKey, idx, career: c, catTitle: cat.title });
    });
  });
});

const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const ytLink = q => "https://www.youtube.com/results?search_query=" + encodeURIComponent(q);

// ---------- RENDER HELPERS ----------
function renderCareerCard(entry) {
  const c = entry.career;
  const coral = entry.branch === "everyday" ? " coral" : "";
  return `
    <div class="career-card${coral}">
      <button class="career-toggle" onclick="toggleCareer(this)" aria-expanded="false">
        <span class="c-emoji">${c.e}</span>
        <span><span class="c-name">${esc(c.n)}</span><br><span class="c-tag">${esc(c.t)}</span></span>
        <span class="c-arrow">▸</span>
      </button>
      <div class="career-body">
        <div class="glimpse"><span class="g-label">👀 A day with data</span>${esc(c.s)}</div>
        <div class="ai-split">
          <div class="ai-box ai-changes"><span class="g-label">🤖 What AI changes</span>${esc(c.c)}</div>
          <div class="ai-box ai-human"><span class="g-label">🧑 What stays human</span>${esc(c.h)}</div>
        </div>
        <div class="talk-box"><span class="g-label">💬 Talk about it</span>${esc(c.q)}</div>
        <a class="watch-link" href="${ytLink(c.y)}" target="_blank" rel="noopener">▶ See it in action (video search)</a>
      </div>
    </div>`;
}

function toggleCareer(btn) {
  const card = btn.closest(".career-card");
  const open = card.classList.toggle("open");
  btn.setAttribute("aria-expanded", open ? "true" : "false");
}

function setActive(branch) {
  ["dataCareers", "everyday", "uses"].forEach(b =>
    document.getElementById(b + "-btn").classList.toggle("active", b === branch));
}

// ---------- VIEWS ----------
function showWelcome() {
  setActive(null);
  let chips = Object.entries(INTERESTS).map(([key, it]) =>
    `<button class="chip" onclick="showInterest('${key}')">${it.emoji} ${it.label}</button>`).join("");
  document.getElementById("center-display").innerHTML = `
    <div class="welcome-message">
      <h2>Where will data & AI show up in YOUR future?</h2>
      <p class="lede">Whether you're headed for a lab, a kitchen, a stage, a job site, or a courtroom,
      data and AI are already part of the job. Explore the branches above, or start with what you love:</p>
      <div class="interest-block">
        <h3>🎯 What are you into?</h3>
        <p>Tap an interest to see careers that match it.</p>
        <div class="chip-row">${chips}</div>
      </div>
    </div>`;
}

function showBranch(branch) {
  setActive(branch);
  const data = content[branch];
  const coral = data.color === "coral";
  let html = `<div class="detail-view">
    <h2 class="section-title${coral ? " coral" : ""}">${data.title}</h2>
    <p class="section-sub">${data.sub}</p>
    <div class="category-grid">`;
  for (const [key, cat] of Object.entries(data.categories)) {
    html += `<button class="category-card${coral ? " coral" : ""}" onclick="showCategory('${branch}','${key}')">
      <h3><span class="emoji">${cat.emoji}</span><span>${cat.title}</span></h3></button>`;
  }
  html += `</div></div>`;
  document.getElementById("center-display").innerHTML = html;
}

function showCategory(branch, catKey) {
  const data = content[branch];
  const cat = data.categories[catKey];
  const coral = data.color === "coral" ? " coral" : "";
  let html = `<div class="detail-view">
    <div class="detail-header${coral}">
      <span class="emoji">${cat.emoji}</span>
      <h2>${cat.title}</h2>
      <button class="back-btn" onclick="showBranch('${branch}')">← Back</button>
    </div>`;

  if (branch === "uses") {
    html += `<ul class="detail-list">` +
      cat.items.map(i => `<li class="detail-item">${i}</li>`).join("") + `</ul>`;
    html += `<div class="cat-talk"><span class="g-label">💬 Talk about it</span>${cat.talk}</div>`;
  } else {
    html += `<p class="section-sub" style="text-align:left; margin-bottom:14px;">Tap a career to peek inside it. 👇</p>`;
    html += `<div class="detail-list">` +
      cat.careers.map((c, idx) => renderCareerCard({ branch, catKey, idx, career: c })).join("") + `</div>`;
  }
  html += `</div>`;
  document.getElementById("center-display").innerHTML = html;
}

function showInterest(tag) {
  setActive(null);
  const it = INTERESTS[tag];
  const matches = ALL_CAREERS.filter(e => e.career.i.includes(tag));
  let html = `<div class="detail-view">
    <div class="detail-header">
      <span class="emoji">${it.emoji}</span>
      <h2>Careers for people into ${it.label.toLowerCase()}</h2>
      <button class="back-btn" onclick="showWelcome()">← Home</button>
    </div>
    <p class="section-sub" style="text-align:left; margin-bottom:14px;">
      ${matches.length} careers match this interest, and every one of them uses data or AI. Tap to explore. 👇</p>
    <div class="detail-list">` +
    matches.map(renderCareerCard).join("") + `</div></div>`;
  document.getElementById("center-display").innerHTML = html;
}

let lastSurprise = -1;
function surpriseMe() {
  setActive(null);
  let pick;
  do { pick = Math.floor(Math.random() * ALL_CAREERS.length); } while (pick === lastSurprise && ALL_CAREERS.length > 1);
  lastSurprise = pick;
  const entry = ALL_CAREERS[pick];
  let html = `<div class="detail-view">
    <div class="detail-header">
      <span class="emoji">🎲</span>
      <h2>Random career: how would data show up here?</h2>
      <button class="back-btn" onclick="showWelcome()">← Home</button>
    </div>
    <p class="section-sub" style="text-align:left; margin-bottom:14px;">
      💡 <strong>Try this first:</strong> before opening the card, guess how data or AI might be part of this job. Then check!</p>
    <div class="detail-list">${renderCareerCard(entry)}</div>
    <p style="text-align:center; margin-top:20px;">
      <button class="back-btn" onclick="surpriseMe()" style="margin-left:0; background:#E89B00;">🎲 Surprise me again</button>
    </p></div>`;
  document.getElementById("center-display").innerHTML = html;
}

showWelcome();
</script>
</body>
</html>
