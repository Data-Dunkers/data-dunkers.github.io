<!doctype html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

{% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <script src="https://code.jquery.com/jquery-3.3.0.min.js" integrity="sha256-RTQy8VOmNlT6b2PIRur37p6JEBZUE7o8wPgMvu18MC4=" crossorigin="anonymous"></script>
    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
    <!--[if lt IE 9]>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js" integrity="sha256-3Jy/GbSLrg0o9y5Z5n1uw0qxZECH7C6OQpVBgNFYa0g=" crossorigin="anonymous"></script>
    <![endif]-->
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

    {% include head-custom.html %}
  </head>
  <body>

      <header>
        <h1>{{ page.title | default: site.title | default: site.github.repository_name }}</h1>
        <p>{{ page.description | default: site.description | default: site.github.project_tagline }}</p>
      </header>

      <div id="banner">
        <!--
        <span id="logo"></span>
        <a href="{{ site.github.repository_url }}" class="button fork"><strong>View On GitHub</strong></a> 
        {% if site.show_downloads %}
          <div class="downloads">
            <span>Downloads:</span>
            <ul>
              <li><a href="{{ site.github.zip_url }}" class="button">ZIP</a></li>
              <li><a href="{{ site.github.tar_url }}" class="button">TAR</a></li>
            </ul>
          </div>
        {% endif %}
        -->
      </div>

    <div class="wrapper">
      <nav>
        <ul></ul>
      </nav>
      <section>
        {{ content }}

      </section>
      <footer>

        <div class="logos" style="margin-top: 30px; text-align: center;">
          <img src="https://raw.githubusercontent.com/Data-Dunkers/branding/refs/heads/main/logos/DellLogo.png" alt="Dell Logo" style="max-width: 150px; margin: 10px;">
          <img src="https://raw.githubusercontent.com/Data-Dunkers/branding/refs/heads/main/logos/DataDunkersLogo.png" alt="Data Dunkers Logo" style="max-width: 150px; margin: 10px;">
          <img src="https://raw.githubusercontent.com/Data-Dunkers/branding/refs/heads/main/logos/PS43FoundationLogo.png" alt="PS43 Logo" style="max-width: 150px; margin: 10px;">
        </div>

      </footer>
    </div>
  </body>
</html>
